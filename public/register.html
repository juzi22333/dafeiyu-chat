<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f3f7fc">
<meta name="color-scheme" content="light">
<title>注册 · 聊天室</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="聊天室">
<link rel="stylesheet" href="/style.css?v=20261112r">
<link rel="stylesheet" href="/room.css?v=20261112r">
</head>
<body data-page="register">
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-title">注册账号</div>
      <div class="auth-sub">账号要纯数字 5 位以上，密码 6 位以上（数字、字母、符号都行）</div>
    </div>
    <label class="auth-field">
      <span class="auth-label">账号</span>
      <input class="auth-input" id="acc" inputmode="numeric" autocomplete="username" placeholder="纯数字，5 位以上" maxlength="20">
    </label>
    <label class="auth-field">
      <span class="auth-label">密码</span>
      <span class="pwd-wrap">
        <input class="auth-input" id="pwd" type="password" autocomplete="new-password" placeholder="至少 6 位，数字字母符号都行">
        <button class="pwd-eye" type="button" data-for="pwd" aria-label="显示密码" tabindex="-1"></button>
      </span>
    </label>
    <label class="auth-field">
      <span class="auth-label">再输一次</span>
      <span class="pwd-wrap">
        <input class="auth-input" id="pwd2" type="password" autocomplete="new-password" placeholder="确认密码">
        <button class="pwd-eye" type="button" data-for="pwd2" aria-label="显示密码" tabindex="-1"></button>
      </span>
    </label>
    <div class="auth-err" id="err" hidden></div>
    <button class="auth-btn" id="submit" type="button">注册并登录</button>
    <div class="auth-foot">已经有账号？<a href="/login">去登录</a></div>
  </div>
</div>
<script src="/auth-client.js?v=20261112r"></script>
</body>
</html>
